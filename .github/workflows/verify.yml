name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q watcher.py notify.py security_scan.py tests
      - run: python security_scan.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
        working-directory: cloudflare-scheduler
      - run: npm run check
        working-directory: cloudflare-scheduler
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
        working-directory: cloudflare-scheduler
      - run: npx wrangler deploy --dry-run --config wrangler.commission.jsonc
        working-directory: cloudflare-scheduler
      - run: git diff --check
