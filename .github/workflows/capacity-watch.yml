name: OCI A1 capacity watch
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'  # UTC; best effort, also minute 17 in Japan.
permissions:
  contents: read
concurrency:
  group: oci-a1-capacity-watch
  cancel-in-progress: false
jobs:
  capacity:
    if: >-
      github.repository == 'tsuchiyatakahirolab/OCI-A1-Capacity-Watch' &&
      !github.event.repository.private && github.ref == 'refs/heads/main' &&
      github.ref_protected && github.event.repository.default_branch == 'main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: oci-watch
    outputs:
      state: ${{ steps.query.outputs.state }}
      result: ${{ steps.query.outputs.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -v && python security_scan.py
      - name: One authenticated bounded report (no retries)
        id: query
        run: python watcher.py
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
  notify:
    needs: capacity
    if: >-
      always() && (needs.capacity.outputs.state == 'AVAILABLE' ||
      needs.capacity.outputs.state == 'OCI_WATCHER_CREDENTIAL_INTEGRITY_ALERT')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 notify.py
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_RESULT: ${{ needs.capacity.outputs.result }}
